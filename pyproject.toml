[project]
name = "greenclose"
version = "0.1.0"
description = "GREENCLOSE: cross-sectional next-day return prediction for Indian equities. Paper only. No broker, no orders, no money."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "duckdb>=1.0",
  "lightgbm>=4.3",
  "scikit-learn>=1.4",
  "catboost>=1.2.5",
  "xgboost>=2.0",
  "statsmodels>=0.14",
  "scipy>=1.12",
  "arch>=7.0",
  "shap>=0.45",
  "yfinance>=0.2.40",
  "typer>=0.12",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
  "structlog>=24.1",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "hypothesis>=6.100",
  "freezegun>=1.4",
  "ruff>=0.4",
  "mypy>=1.10",
  "pandas-stubs>=2.2",
  "types-PyYAML>=6.0",
]

[project.scripts]
greenclose = "greenclose.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/greenclose"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
